name: Update forecast

on:
  schedule:
    # UTC times. Roughly 04:20, 10:20, 16:20 and 22:20 UK winter time.
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecast and score peaks
        run: python scripts/fetch_forecast.py
      - name: Commit updated data
        run: |
          git config user.name "inversion-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update forecast $(date -u +'%Y-%m-%d %H:%M') UTC"
          # If anything else was committed while this ran, catch up first, then push.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push failed, trying again in 10 seconds"
            sleep 10
          done
          exit 1
          
