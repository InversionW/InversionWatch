name: Update forecast

on:
  schedule:
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecast and score peaks
        run: python scripts/fetch_forecast.py
      - name: Commit updated data
        run: |
          git config user.name "inversion-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update forecast $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
