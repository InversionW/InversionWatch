name: Build summit skylines

# Run this once by hand (Actions > Build summit skylines > Run workflow),
# and again whenever you add peaks. Mountains don't move, so it never needs a schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install terrain tools
        run: pip install numpy rasterio
      - name: Work out the skyline from every summit
        run: python scripts/build_terrain.py
      - name: Find a 360° photo on each summit
        run: python scripts/find_panos.py
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      - name: Commit skylines
        run: |
          git config user.name "inversion-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terrain data/panos.json 2>/dev/null || git add data/terrain
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build summit skylines"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push failed, trying again in 10 seconds"
            sleep 10
          done
          exit 1
